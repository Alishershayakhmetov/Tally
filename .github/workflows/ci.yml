name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # node:sqlite (used by the day-cutoff parity test) needs Node 22.5+
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate
          test -z "$(git status --porcelain drizzle)"
      - name: Android bundle builds
        run: npx expo export --platform android --output-dir dist
