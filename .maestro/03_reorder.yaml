appId: com.alishershayakhmetov.taskcounter
name: Task order, the drag hint, and the order surviving a restart
---
# Dragging itself needs a press held still before the finger moves, which
# Maestro's swipe can't do; it's checked by hand with `adb shell input
# draganddrop` (SPEC Phase 8). This flow covers what surrounds it.
- launchApp:
    clearState: true
- runFlow:
    file: subflows/create_from_template.yaml
    env:
      TEMPLATE: Water
- back
- runFlow:
    file: subflows/create_from_template.yaml
    env:
      TEMPLATE: Push-ups
- back

# New tasks go to the end, and with two of them Home explains how to move them.
- assertVisible:
    text: 'Push-ups, .*'
    below: 'Water, .*'
- assertVisible: 'Hold a card to drag it to a new place.'

# A short tap still opens the task.
- tapOn: 'Water, .*'
- assertVisible: 'Enter amount…'
- back

- stopApp
- launchApp
- assertVisible:
    text: 'Push-ups, .*'
    below: 'Water, .*'
